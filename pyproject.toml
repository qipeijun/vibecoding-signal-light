[project]
name = "signal-light"
version = "1.0.3"
description = "Native macOS status light for Codex, Claude Code and local AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai-agent",
    "ai-coding",
    "codex",
    "claude-code",
    "macos",
    "appkit",
    "menubar",
    "status-light",
    "developer-tools",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
    "Topic :: Desktop Environment",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
signal-light = "signal_light.cli:main"
codex-signal-hook = "signal_light.codex_hook:main"
claude-code-signal-hook = "signal_light.claude_code_hook:main"

[project.urls]
Homepage = "https://qipeijun.github.io/vibecoding-signal-light/"
Repository = "https://github.com/qipeijun/vibecoding-signal-light"
Issues = "https://github.com/qipeijun/vibecoding-signal-light/issues"
