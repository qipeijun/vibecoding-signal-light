name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动发布版本号，例如 1.0.3"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Build macOS installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 获取版本号
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
            VERSION="${VERSION#v}"
            if [[ -z "${VERSION}" || "${VERSION}" == "0.0.0-dev" ]]; then
              echo "手动发布必须填写真实版本号，例如 1.0.3"
              exit 1
            fi
            RELEASE_TAG="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "版本: ${VERSION}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Swift 构建检查
        run: swift build --package-path .

      - name: Python 测试
        run: PYTHONPATH=. uv run pytest

      - name: 构建安装包
        run: ./scripts/build-installer
        env:
          SIGNAL_LIGHT_VERSION: ${{ env.VERSION }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: 生成校验文件
        run: |
          cd dist
          shasum -a 256 Signal-Light-Installer.pkg > Signal-Light-Installer.pkg.sha256

      - name: 上传到 Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Signal Light ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Full Changelog: https://github.com/${{ github.repository }}/commits/${{ env.RELEASE_TAG }}
          files: |
            dist/Signal-Light-Installer.pkg
            dist/Signal-Light-Installer.pkg.sha256

      - name: 上传构建产物 (非 tag)
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: signal-light-installer
          path: |
            dist/Signal-Light-Installer.pkg
            dist/Signal-Light-Installer.pkg.sha256
          if-no-files-found: error
