name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动发布版本号，例如 1.0.3"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Build macOS installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 检查 Apple 发布凭据
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing_count=0
          required_values=(
            "$MACOS_CERTIFICATE_P12_BASE64"
            "$MACOS_CERTIFICATE_PASSWORD"
            "$DEVELOPER_ID_APPLICATION"
            "$DEVELOPER_ID_INSTALLER"
            "$APPLE_ID"
            "$APPLE_TEAM_ID"
            "$APPLE_APP_SPECIFIC_PASSWORD"
          )
          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              missing_count=$((missing_count + 1))
            fi
          done

          if [[ "$missing_count" -eq 0 ]]; then
            echo "SIGNED_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "::notice::未配置 Apple 发布凭据，本次将发布 ad-hoc 签名安装包。"
          fi

      - name: 导入 Apple 签名证书
        if: env.SIGNED_RELEASE == '1'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signal-light-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/signal-light-certificate.p12"
          echo "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: 获取版本号
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
            VERSION="${VERSION#v}"
            if [[ -z "${VERSION}" || "${VERSION}" == "0.0.0-dev" ]]; then
              echo "手动发布必须填写真实版本号，例如 1.0.3"
              exit 1
            fi
            RELEASE_TAG="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "版本: ${VERSION}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Swift 构建检查
        run: swift build --package-path .

      - name: Swift 测试
        run: swift test --package-path .

      - name: Python 测试
        run: PYTHONPATH=. uv run pytest

      - name: 安装升级卸载 E2E
        run: tests/e2e/installer-lifecycle.sh .build/debug/signal-light-cli

      - name: 构建安装包
        run: ./scripts/build-installer
        env:
          SIGNAL_LIGHT_VERSION: ${{ env.VERSION }}
          SIGNAL_LIGHT_CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          SIGNAL_LIGHT_INSTALLER_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGNAL_LIGHT_REQUIRE_SIGNING: ${{ env.SIGNED_RELEASE }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: 验证安装包内容
        run: scripts/verify-installer dist/Signal-Light-Installer.pkg

      - name: 验证签名与公证
        if: env.SIGNED_RELEASE == '1'
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/build/Signal Light.app"
          pkgutil --check-signature dist/Signal-Light-Installer.pkg
          xcrun stapler validate dist/Signal-Light-Installer.pkg
          spctl --assess --verbose=2 --type install dist/Signal-Light-Installer.pkg

      - name: 生成校验文件
        run: |
          cd dist
          shasum -a 256 Signal-Light-Installer.pkg > Signal-Light-Installer.pkg.sha256

      - name: 上传到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Signal Light ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            安装包签名：${{ env.SIGNED_RELEASE == '1' && 'Developer ID 签名并完成 Apple 公证' || 'ad-hoc 签名，安装时可能需要在“系统设置 → 隐私与安全性”中选择“仍要打开”' }}

            Full Changelog: https://github.com/${{ github.repository }}/commits/${{ env.RELEASE_TAG }}
          files: |
            dist/Signal-Light-Installer.pkg
            dist/Signal-Light-Installer.pkg.sha256

      - name: 上传未签名构建产物
        if: env.SIGNED_RELEASE != '1'
        uses: actions/upload-artifact@v6
        with:
          name: signal-light-installer
          path: |
            dist/Signal-Light-Installer.pkg
            dist/Signal-Light-Installer.pkg.sha256
          if-no-files-found: error
